name: Release

# Versioned releases: pushing a tag like v0.0.2 builds the Electrum
# external-plugin zip and publishes it as a permanent GitHub release for that
# tag. The tag must match the version in clink/manifest.json (checked below),
# so a released zip is always traceable to its exact source.
#
# To cut a release:
#   1. bump "version" in clink/manifest.json on main
#   2. git tag v<version> && git push origin v<version>
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build plugin zip
        id: build
        run: |
          python scripts/build_zip.py
          ls -l dist/
          version=$(python -c "import json; print(json.load(open('clink/manifest.json'))['version'])")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Check tag matches manifest version
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          version="${{ steps.build.outputs.version }}"
          if [ "$tag" != "v$version" ]; then
            echo "Tag $tag does not match manifest version v$version" >&2
            exit 1
          fi

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" dist/clink-*.zip \
            --target "$GITHUB_SHA" \
            --title "CLINK plugin ${GITHUB_REF_NAME}" \
            --notes "CLINK plugin version ${{ steps.build.outputs.version }} (commit ${GITHUB_SHA:0:7}).

          Install in Electrum via **Tools -> Plugins -> Add** using the attached zip."
